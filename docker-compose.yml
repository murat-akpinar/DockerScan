services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dockscan_backend:${VERSION:-latest}
    container_name: dockscan_backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - TZ=${TZ}
      - PORT=8080
      - EXPORT_DIR=/app/export
      - FRONTEND_PORT=${FRONTEND_PORT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - ${EXPORT_DIR:-./export}:/app/export:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: dockscan_nginx:${VERSION:-latest}
    container_name: dockscan-nginx
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
